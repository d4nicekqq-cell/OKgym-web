<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OK GYM promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: grid; place-items: center; }
  canvas { height: 100vh; width: auto; max-width: 100vw; background: #0a0a0a; }
  #status { position: fixed; left: 8px; bottom: 8px; color: #888; font: 12px system-ui; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="status"></div>
<script>
// Instagram Reels promo, 1080 × 1920, 30 fps. Everything is drawn by render(t) and timed from
// the ElevenLabs voice-over (timing.json), so cuts land on the spoken words. ?export renders
// every frame for the export server, which then mixes the voice and the sound effects (CUES).
const W = 1080, H = 1920, FPS = 30;
const FG = '#eeece6', MUTED = '#a9a8a1', ACC = '#fd8800', BG = '#0a0a0a';
const PAD = 84, CW = W - 2 * PAD;
const VOICE_AT = 0.3;            // the voice starts this far into the video
const c = document.getElementById('c'), x = c.getContext('2d');

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const out4 = (p) => 1 - Math.pow(1 - p, 4);
const inOut = (p) => (p < 0.5 ? 8 * p ** 4 : 1 - Math.pow(-2 * p + 2, 4) / 2);

const font = (size, weight = 900, stretch = 'condensed') => {
  x.font = `${stretch} ${weight} ${size}px Archivo`;
  x.fontStretch = stretch;
};
const widthAt = (text, size, weight, stretch) => { font(size, weight, stretch); return x.measureText(text).width; };
const fitSize = (text, width, weight = 900, stretch = 'condensed', max = 1e9) =>
  Math.min(max, (100 * width) / widthAt(text, 100, weight, stretch));

// Text that rises out of a mask (pin 0→1)
function rise(text, X, base, size, color, pin, o = {}) {
  if (pin <= 0) return;
  const { weight = 900, stretch = 'condensed', sx = 1, drop = 0.27 } = o;
  const top = base - size * 1.05, h = size * (1.05 + drop);
  x.save();
  x.beginPath(); x.rect(0, top, W, h); x.clip();
  font(size, weight, stretch);
  x.fillStyle = color; x.textAlign = 'left'; x.textBaseline = 'alphabetic';
  x.translate(X, base + (1 - out4(pin)) * h); x.scale(sx, 1);
  x.fillText(text, 0, 0);
  x.restore();
}

// A word scaled around the screen centre, for punch-ins and slams
function slam(text, base, size, color, k = 1, o = {}) {
  const { stretch = 'condensed', sx = 1, dx = 0, alpha = 1, weight = 900 } = o;
  const cy = base - size * 0.36;
  x.save();
  x.globalAlpha = alpha;
  x.translate(W / 2, cy); x.scale(k, k); x.translate(-W / 2, -cy);
  font(size, weight, stretch);
  x.fillStyle = color; x.textAlign = 'left'; x.textBaseline = 'alphabetic';
  x.translate(PAD + dx, base); x.scale(sx, 1);
  x.fillText(text, 0, 0);
  x.restore();
}
const punch = (u, from = 1.16, d = 0.16) => 1 + (from - 1) * (1 - out4(seg(u, 0, d)));
const bg = (col) => { x.fillStyle = col; x.fillRect(0, 0, W, H); };

// Fill the content width at a fixed size: nearest font width, then scale the rest
const STRETCHES = ['extra-condensed', 'condensed', 'semi-condensed', 'normal', 'semi-expanded', 'expanded'];
function fillWidth(text, size) {
  let best = STRETCHES[0];
  for (const s of STRETCHES) if (widthAt(text, size, 900, s) <= CW) best = s;
  return { stretch: best, sx: CW / widthAt(text, size, 900, best) };
}

// Full-screen orange panel that sweeps up over one scene and off the top into the next
function wipe(t, a) {
  const k = inOut(seg(t, a, a + 0.3)), m = inOut(seg(t, a + 0.3, a + 0.6));
  if (k <= 0 || m >= 1) return;
  x.fillStyle = ACC;
  if (m > 0) x.fillRect(0, 0, W, H * (1 - m));
  else x.fillRect(0, H * (1 - k), W, H * k);
}

/* ---------- Timeline from the voice ---------- */
let S, DUR, CUES = [];
const at = (id, i = 0) => S[id].words[i].t + VOICE_AT;     // when word i of a scene is spoken
const start = (id) => S[id].t + VOICE_AT - 0.06;           // cut slightly ahead of the word

function buildCues() {
  const cue = (name, t, gain = 1) => CUES.push({ name, t: Math.max(0, t), gain });
  S.hook.words.forEach((_, i) => cue(i === 0 ? 'boom' : 'hit', at('hook', i) - 0.03, i === 0 ? 0.7 : 0.9));
  [0, 1, 3].forEach((i) => cue('hit', at('roof', i) - 0.03, 0.7));
  cue('riser', start('logo') - 1.5, 0.55);
  cue('boom', start('logo'), 0.9);
  S.tag.words.forEach((_, i) => cue('whoosh', at('tag', i) - 0.18, 0.8));
  for (let i = 0; i < 7; i++) cue('whoosh', start(`f${i}`) - 0.15, 0.55);
  cue('weights', start('f0') + 0.05, 0.8);
  cue('punch', start('f1') + 0.05, 0.9);
  cue('whoosh', start('hours') - 0.3, 0.8);
  cue('whoosh', start('cta') - 0.3, 0.8);
  cue('boom', start('cta'), 0.8);
}

/* ---------- Scenes ---------- */

// Hook: the seven activities fire one per spoken word, flipping black / orange
const HOOK = ['POSILOVNA', 'BOX', 'LEZENÍ', 'LEKCE', 'SAUNY', 'MASÁŽE', 'SOLÁRIUM'];
function hook(t) {
  let i = 0;
  while (i < 6 && t >= at('hook', i + 1) - 0.03) i++;
  const u = t - (i === 0 ? 0 : at('hook', i) - 0.03);
  const flip = i % 2 === 1;
  bg(flip ? ACC : BG);
  const w = HOOK[i], s = fitSize(w, CW, 900, 'condensed', 420);
  slam(w, 960 + s * 0.36, s, flip ? BG : FG, punch(u, 1.22, 0.18));
}

// "Všechno pod jednou střechou." then the name on orange
const ROOF = [['VŠECHNO', 0], ['POD JEDNOU', 1], ['STŘECHOU.', 3]];
function roof(t) {
  if (t < start('logo')) {
    bg(BG);
    const s = fitSize('POD JEDNOU', CW, 900, 'condensed');
    const lh = s * 0.9, first = 960 - lh * 1.5 + s * 0.78;
    ROOF.forEach(([w, word], i) => {
      const { stretch, sx } = fillWidth(w, s);
      const a = at('roof', word) - 0.05;
      rise(w, PAD, first + i * lh, s, i === 2 ? ACC : FG, seg(t, a, a + 0.2), { stretch, sx, drop: 0.02 });
    });
    return;
  }
  const v = t - start('logo');
  bg(ACC);
  const s = fitSize('OK GYM', CW, 900, 'normal', 320);
  slam('OK GYM', 960, s, BG, punch(v, 1.3, 0.22), { stretch: 'normal' });
  rise('Fitcentrum Pardubice', PAD, 1060, 56, BG, seg(v, 0.2, 0.5), { weight: 600, stretch: 'normal' });
}

// Tagline: one word per screen, sliding in fast with a short speed trail
const TAG = [['TRÉNINK', BG, FG], ['ADRENALIN', ACC, BG], ['REGENERACE', BG, FG]];
function tagline(t) {
  let i = 0;
  while (i < 2 && t >= at('tag', i + 1) - 0.12) i++;
  const u = t - (at('tag', i) - 0.12);
  const [w, back, ink] = TAG[i];
  bg(back);
  const s = fitSize(w, CW, 900, 'condensed', 400);
  const p = out4(seg(u, 0, 0.24)), dx = (1 - p) * W * 0.9;
  for (let g = 3; g >= 1; g--) slam(w, 960 + s * 0.36, s, ink, 1, { dx: dx + g * 70 * (1 - p), alpha: 0.12 * (1 - p) });
  slam(w, 960 + s * 0.36, s, ink, 1 + 0.04 * seg(u, 0.24, 1), { dx });
}

// Each activity with its headline number counting up
const FACTS = [
  ['1. patro', 'POSILOVNA', 800, 'm²', 'Kardio, stroje, volné váhy'],
  ['1. patro', 'BOX', 700, 'm²', 'Ring, pytle, lapy'],
  ['Přízemí', 'LEZENÍ', 8, 'm', 'Stěna, boulder, MoonBoard'],
  ['Přízemí', 'LEKCE', 5, 'druhů', 'Bungee, H.E.A.T., Tabata, pilates, jóga'],
  ['Přízemí', 'SAUNY', 90, '°C', 'Finská, bio, infrasauna'],
  ['Přízemí', 'MASÁŽE', null, '', 'Po tréninku, lezení i sauně'],
  ['1. patro', 'SOLÁRIUM', null, '', 'Ergoline Inspiration 400'],
];
function facts(t) {
  bg(BG);
  let i = 0;
  while (i < 6 && t >= start(`f${i + 1}`)) i++;
  const a = start(`f${i}`), b = i < 6 ? start(`f${i + 1}`) : start('hours');
  const u = t - a;
  const [floor, name, n, unit, line] = FACTS[i];
  const s = fitSize(name, CW, 900, 'condensed', 340);
  const base = 1120;
  rise(floor, PAD, 620, 48, MUTED, seg(u, 0, 0.22), { weight: 500, stretch: 'normal' });
  if (n !== null) {
    const ns = 210;
    rise(`${Math.round(n * out4(seg(u, 0.05, 0.6)))}`, PAD, 830, ns, ACC, seg(u, 0, 0.2));
    rise(unit, PAD + widthAt(`${n}`, ns, 900, 'condensed') + 18, 830, 70, ACC, seg(u, 0.08, 0.3), { weight: 700, stretch: 'normal' });
  }
  slam(name, base, s, FG, punch(u, 1.12, 0.2));
  rise(line, PAD, base + 100, 46, FG, seg(u, 0.1, 0.35), { weight: 400, stretch: 'normal' });
  // progress: seven marks, the current one fills while its activity is on
  const gap = 12, w = (CW - gap * 6) / 7, fill = seg(t, a, b);
  for (let k = 0; k < 7; k++) {
    const X = PAD + k * (w + gap);
    x.fillStyle = k < i ? 'rgba(238, 236, 230, .55)' : 'rgba(238, 236, 230, .16)';
    x.fillRect(X, 1420, w, 5);
    if (k === i) { x.fillStyle = ACC; x.fillRect(X, 1420, w * fill, 5); }
  }
}

const H0 = 6 * 60, H1 = 23 * 60;
const px = (m) => PAD + (CW * (m - H0)) / (H1 - H0);
const fmt = (m) => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
function bar(u, y, label, a, b, delay) {
  rise(label, PAD, y - 40, 52, FG, seg(u, delay - 0.15, delay + 0.12), { weight: 700, stretch: 'normal' });
  x.globalAlpha = seg(u, delay, delay + 0.12);
  x.fillStyle = 'rgba(238, 236, 230, .08)';
  x.fillRect(PAD, y, CW, 26);
  x.fillStyle = FG;
  x.fillRect(px(a), y, (px(b) - px(a)) * out4(seg(u, delay + 0.05, delay + 0.5)), 26);
  x.globalAlpha = seg(u, delay + 0.35, delay + 0.5);
  font(40, 400, 'normal'); x.fillStyle = MUTED; x.textBaseline = 'alphabetic';
  x.textAlign = 'left'; x.fillText(fmt(a), px(a), y + 76);
  x.textAlign = 'right'; x.fillText(fmt(b), px(b), y + 76);
  x.globalAlpha = 1;
}
function hours(t) {
  bg(BG);
  const u = t - start('hours');
  const s = fitSize('KAŽDÝ DEN', CW, 900, 'condensed', 240);
  rise('OTEVŘENO', PAD, 560, 80, ACC, seg(u, 0, 0.2), { weight: 800, stretch: 'normal' });
  const kd = at('hours', 1) - start('hours');
  rise('KAŽDÝ DEN', PAD, 560 + s * 0.95, s, FG, seg(u, kd - 0.08, kd + 0.18));
  bar(u, 1000, '1. patro · po–pá', 7 * 60, 21 * 60 + 30, 0.25);
  bar(u, 1220, 'Přízemí · po–pá', 7 * 60 + 30, 22 * 60, 0.38);
  rise('So, ne a svátky 9:00–12:00 · 14:00–21:00', PAD, 1440, 44, FG, seg(u, 0.7, 0.95), { weight: 500, stretch: 'normal' });
}

function outro(t) {
  const u = t - start('cta');
  bg(BG);
  const s = fitSize('REZERVACE', CW, 900, 'condensed', 320);
  slam('REZERVACE', 900, s, FG, punch(u, 1.25, 0.2));
  const on = at('cta', 1) - start('cta');
  rise('ONLINE', PAD, 900 + s * 0.9, s, ACC, seg(u, on - 0.05, on + 0.2));
  const web = at('cta', 3) - start('cta');
  rise('okgym.cz', PAD, 1290, 84, FG, seg(u, web - 0.05, web + 0.25), { weight: 700, stretch: 'normal' });
  rise('Hůrka 1832, Pardubice – Dubina', PAD, 1370, 44, MUTED, seg(u, web + 0.3, web + 0.6), { weight: 400, stretch: 'normal' });
}

function render(t) {
  if (t < start('roof')) hook(t);
  else if (t < start('tag')) roof(t);
  else if (t < start('f0')) tagline(t);
  else if (t < start('hours')) facts(t);
  else if (t < start('cta')) hours(t);
  else outro(t);
  wipe(t, start('hours') - 0.3);
  wipe(t, start('cta') - 0.3);
}

/* ---------- Play live, show one frame (?t=12.5), or export (?export) ---------- */
const q = new URLSearchParams(location.search);
const status = document.getElementById('status');
Promise.all([
  fetch('timing.json').then((r) => r.json()),
  document.fonts.load('900 100px Archivo').then(() => document.fonts.ready),
]).then(async ([timing]) => {
  S = timing.scenes;
  DUR = Math.ceil(timing.duration + VOICE_AT + 2.2);
  buildCues();
  if (q.has('t')) { render(+q.get('t')); return; }
  if (q.has('export')) {
    const n = DUR * FPS;
    for (let i = 0; i < n; i++) {
      render(i / FPS);
      const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
      await fetch(`/frame/${i}`, { method: 'POST', body: blob });
      status.textContent = `${i + 1} / ${n}`;
    }
    const res = await fetch('/done', { method: 'POST', body: JSON.stringify({ frames: n, voiceAt: VOICE_AT, cues: CUES }) });
    status.textContent = await res.text();
    return;
  }
  const t0 = performance.now();
  const loop = () => { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  loop();
});
</script>
</body>
</html>
